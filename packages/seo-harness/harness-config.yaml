# Grandeur SEO Agent Harness - machine-readable config
# Wire this into your scheduler of choice (Cowork scheduled runs, n8n, Make, or a custom API loop).
# Model IDs MUST be verified against https://docs.claude.com before deploying.
# Current family per the build environment (27 Sep 2026): claude-opus-5-5, claude-sonnet-5, claude-haiku-4-5.
# v0.1 used claude-opus-4-8 and claude-sonnet-4-6 (see HARNESS.md "Changes from v0.1").
# Keep in sync with src/index.ts (checked by src/index.test.ts).

harness:
  name: grandeur-seo-harness
  version: 0.2.0
  shared_state_dir: ./reports          # every agent reads/writes dated artifacts here
  human_gates: [approve_idea, send_outreach, delete_pages, spend_over_cap, approve_plan]
  publishing:
    autopost_default: true             # per-site setting publishing.autopost; default on (founder direction C10)
    auto_merge_on_green_ci: true       # CMS agent merges the post MR when the repo's CI passes
    when_autopost_off: human_review    # post stops at In review for a human
  product_agent: cms-agent             # native agent of the Agentic CMS surface; outside the harness count; sole repo writer

agents:
  orchestrator:
    model: claude-haiku-4-5
    role: scheduler-dispatcher
    responsibilities: [check_preconditions, route_runs, pass_latest_artifacts, log_gaps_to_qa_ledger]

  seo-action-plan:
    model: claude-opus-5-5
    skill: seo-action-plan.skill
    schedule: on_demand            # plus auto-queued on pivot trigger
    inputs: [brand_interview, research]
    outputs: [plan_html, pillar_keywords_csv]

  keyword-research-swarm:
    model: claude-sonnet-5
    skill: keyword-research-swarm.skill
    schedule: weekly_monday
    inputs: [pillar_keywords_csv, tracker_csv]
    outputs: [pipeline_csv, top10_md]

  blog-writing-agent:
    model: claude-sonnet-5
    escalate_to: { model: claude-opus-5-5, when: [pillar_page, money_page] }
    skill: blog-writing-agent.skill
    schedule: per_publish_slot
    inputs: [brief_or_keyword, brand_pack]
    outputs: [draft_md, image_production_sheet, verify_list]
    hands_off_to: visual-asset-agent

  on-page-seo-optimizer:
    model: claude-sonnet-5
    skill: on-page-seo-optimizer.skill
    schedule: per_post_after_draft
    inputs: [draft_md, target_keyword, intent]
    outputs: [scorecard_md, optimized_post]

  technical-seo-monitor:
    model: claude-haiku-4-5
    escalate_to: { model: claude-sonnet-5, when: [ambiguous_diagnosis] }
    skill: technical-seo-monitor.skill
    schedule: weekly_friday
    inputs: [site_url, previous_digest]
    outputs: [digest_md]

  content-refresh-agent:
    model: claude-sonnet-5
    skill: content-refresh-agent.skill
    schedule: monthly_day1
    inputs: [gsc_export, site_url, previous_cycle_report]
    outputs: [refresh_drafts, prune_signoff_list, cycle_report_md]

  link-building-prospector:
    model: claude-sonnet-5
    skill: link-building-prospector.skill
    schedule: monthly_day1
    inputs: [competitors, backlink_export_optional, sender_profile]
    outputs: [prospect_csv, outreach_drafts, human_action_list]

  seo-qa-agent:
    model: claude-sonnet-5
    skill: seo-qa-agent.skill
    schedule: { light: weekly_friday, full: biweekly_friday }
    inputs: [all_agent_artifacts, site_url, action_plan_milestones, human_ledger_previous]
    outputs: [qa_scorecard, human_ledger_json, blockers_md]
    authority: demands_human_updates_with_deadlines

  visualization-report-agent:
    model: claude-sonnet-5
    escalate_to: { model: claude-opus-5-5, when: [pivot_trigger_fired] }
    skill: visualization-report-agent.skill
    schedule: biweekly_friday_after_qa
    inputs: [qa_scorecard, gsc_export, all_agent_artifacts, bound_template]
    outputs: [biweekly_report_html, pivot_flags]

  visual-asset-agent:
    model: claude-sonnet-5
    model_tier: workhorse
    skill: visual-asset-agent.skill
    schedule: per_post_after_draft
    inputs: [image_production_sheet, brand_pack, post_content, connections]
    outputs: [asset_candidates, svg_diagrams, provenance_log]
    routing:
      brand_imagery: connected_mcp_or_api      # higgsfield preferred
      diagram: svg_from_content
      text_in_image: image_api                 # openai
      volume: open_source
      chart: inline_svg_never_generated
      stock_or_real_world: web_source_licensed
    guardrails:
      - no_identifiable_real_people_unless_licensed
      - no_living_artist_style_imitation
      - no_watermarks
      - no_nc_license_on_commercial_site_unless_allowed
      - diagrams_use_only_post_facts_never_invented_numbers
      - record_provenance_for_every_asset
      - estimate_before_run_refuse_over_cap
      - secrets_never_in_prompts
      - on_failure_try_next_route_else_hold_slot_with_ledger_item

  site-discovery-agent:
    model: claude-sonnet-5
    model_tier: workhorse
    escalate_to: { model: claude-opus-5-5, when: [site_profile] }   # the site profile runs on the strongest tier
    skill: site-discovery-agent.skill
    schedule: [on_site_add, on_demand]
    inputs: [site_domain, gsc_export, keyword_csv_import]
    outputs: [site_profile, pillar_keywords_csv, brand_pack_draft, content_map]
    hands_off: { pillar_keywords_csv: keyword-research-swarm, content_map: content-refresh-agent }

escalation:
  stale_human_item_days_warn: 7
  stale_human_item_days_block: 14
  pivot_review_after_consecutive_below_threshold_reports: 2
